<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa - Tijuana Café Guide</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
     
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coffee: { 900: '#3C2A21', 500: '#B08968' },
                        amber: { 500: '#D97706' }
                    }
                }
            }
        }
    </script>

    <style>
        /* Ajuste para que el mapa ocupe exactamente el espacio restante */
        body, html { margin: 0; padding: 0; height: 100%; }
        #map { z-index: 1; }
        
        /* Estilos para el botón personalizado de ubicación */
        .custom-control-btn {
            background-color: white;
            width: 34px;
            height: 34px;
            border-radius: 4px;
            border: 2px solid rgba(0,0,0,0.2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }
        .custom-control-btn:hover { background-color: #f4f4f4; }
        .custom-control-btn i { color: #333; font-size: 16px; }
    </style>
</head>
<body class="flex flex-col h-screen bg-gray-100">

    <nav class="bg-coffee-900 text-white p-4 flex justify-between items-center shadow-md z-20 h-16">
        <div class="font-bold text-lg tracking-wider">
            <a href="/" class="flex items-center gap-2">
                <i class="fas fa-mug-hot text-amber-500"></i> TJ CAFÉ GUIDE
            </a>
        </div>
        <div>
            <a href="/" class="text-sm hover:text-amber-500 transition">Volver al Inicio</a>
        </div>
    </nav>

    <div id="map" class="w-full h-[calc(100vh-4rem)]"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

    <script>
        // 1. Inicialización del mapa
        // Centrado en Tijuana
        const map = L.map('map', {
            zoomControl: false // Desactivamos el zoom por defecto para moverlo
        }).setView([32.5149, -117.0382], 13);

        // 2. Capa de Mapa (TileLayer) - OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // 3. Aplicación de Ley de Fitts: Controles a la derecha abajo
        L.control.zoom({
            position: 'bottomright'
        }).addTo(map);

        // 4. Botón personalizado de "Mi Ubicación"
        const LocationControl = L.Control.extend({
            options: { position: 'bottomright' },
            onAdd: function(map) {
                const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control custom-control-btn');
                container.innerHTML = '<i class="fas fa-crosshairs"></i>';
                container.title = "Mi Ubicación";
                
                container.onclick = function(){
                    alert("En fases futuras, esto pedirá permiso de GPS.");
                }
                return container;
            }
        });
        map.addControl(new LocationControl());

    </script>
</body>
</html>
