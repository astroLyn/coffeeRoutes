<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa - Tijuana Café Guide</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body, html { margin: 0; padding: 0; height: 100%; }
        #map { z-index: 1; }

        /* Estilos para el Toast (Notificación) */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 1000; /* Por encima del mapa */
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 17px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            opacity: 0;
            transition: opacity 0.5s, bottom 0.5s;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }
        
        /* Animación de Spinner simple */
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #D97706; /* Color Amber */
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 5px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex flex-col h-screen bg-gray-100">

    <nav class="bg-[#3C2A21] text-white p-4 flex justify-between items-center shadow-md z-20 h-16">
        <div class="font-bold text-lg tracking-wider">
            <a href="/" class="flex items-center gap-2">
                <i class="fas fa-mug-hot text-amber-500"></i> TJ CAFÉ GUIDE
            </a>
        </div>
        <div><a href="/" class="text-sm hover:text-amber-500 transition">Volver</a></div>
    </nav>

    <div id="map" class="w-full h-[calc(100vh-4rem)]"></div>

    <div id="toast">Notificación</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // Inicialización
        const map = L.map('map', { zoomControl: false }).setView([32.5149, -117.0382], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Variable para guardar el marcador temporal actual
        let tempMarker = null;

        // --- LÓGICA DE INTERACCIÓN (Fase 3) ---

        // 1. Evento Clic en el Mapa
        map.on('click', function(e) {
            // Si ya hay un marcador temporal, lo quitamos (Prevención de errores)
            if (tempMarker) {
                map.removeLayer(tempMarker);
            }

            const lat = e.latlng.lat;
            const lng = e.latlng.lng;

            // 2. Feedback Inmediato: Poner marcador visualmente
            tempMarker = L.marker([lat, lng]).addTo(map);

            // Contenido del Popup con botones
            const popupContent = `
                <div class="text-center p-2">
                    <p class="font-bold mb-2 text-gray-700">¿Aquí hay un café?</p>
                    <div id="popup-controls">
                        <button onclick="cancelarPunto()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-1 px-3 rounded text-sm mr-2">
                            Cancelar
                        </button>
                        <button onclick="guardarPunto(${lat}, ${lng})" class="bg-amber-500 hover:bg-amber-600 text-white font-bold py-1 px-3 rounded text-sm">
                            Guardar
                        </button>
                    </div>
                    <div id="popup-loading" class="hidden text-amber-600 font-bold text-sm mt-2">
                        <div class="spinner"></div> Guardando...
                    </div>
                </div>
            `;

            tempMarker.bindPopup(popupContent).openPopup();
            
            // Si el usuario cierra el popup manualmente, borramos el marcador temporal
            tempMarker.on('popupclose', function() {
                // Pequeño timeout para no borrarlo si es por éxito
                setTimeout(() => {
                    if (tempMarker && !tempMarker.isSaved) {
                        map.removeLayer(tempMarker);
                        tempMarker = null;
                    }
                }, 100);
            });
        });

        // 3. Función Cancelar (Prevención de errores)
        window.cancelarPunto = function() {
            if (tempMarker) {
                map.removeLayer(tempMarker);
                tempMarker = null;
                showToast("Acción cancelada");
            }
        };

        // 4. Función Guardar (Conexión Fetch + Feedback de Latencia)
        window.guardarPunto = function(lat, lng) {
            // A. Cambio de Estado UI: Ocultar botones, mostrar spinner
            document.getElementById('popup-controls').classList.add('hidden');
            document.getElementById('popup-loading').classList.remove('hidden');

            // B. Petición al Backend
            fetch('/guardar_punto', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ lat: lat, lng: lng }),
            })
            .then(response => response.json())
            .then(data => {
                // C. Feedback de Éxito
                if (data.status === 'success') {
                    // Marcar como guardado para que no se borre al cerrar popup
                    tempMarker.isSaved = true; 
                    
                    // Cerrar popup y mostrar Toast
                    tempMarker.closePopup();
                    tempMarker.bindPopup(`<b class="text-amber-700">${data.data.nombre}</b><br>Lat: ${lat.toFixed(4)}`).openPopup();
                    
                    showToast("¡Café guardado con éxito!");
                    
                    // Liberar variable temp para el siguiente
                    tempMarker = null; 
                }
            })
            .catch((error) => {
                console.error('Error:', error);
                showToast("Error al conectar con el servidor");
                // Restaurar estado del popup
                document.getElementById('popup-controls').classList.remove('hidden');
                document.getElementById('popup-loading').classList.add('hidden');
            });
        };

        // Función auxiliar para mostrar Toast
        function showToast(message) {
            var x = document.getElementById("toast");
            x.innerText = message;
            x.className = "show";
            setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
        }
    </script>
</body>
</html>
