<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa y Lista - Tijuana Café Guide</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body, html { margin: 0; padding: 0; height: 100%; }
        /* Animación suave para la tarjeta de la lista */
        .cafe-card { transition: all 0.3s ease; border-left: 4px solid transparent; }
        .cafe-card:hover { background-color: #f3f4f6; border-left: 4px solid #D97706; cursor: pointer; }
        
        /* Spinner */
        .spinner {
            border: 3px solid #f3f3f3; border-top: 3px solid #D97706; border-radius: 50%;
            width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Toast */
        #toast {
            visibility: hidden; min-width: 250px; background-color: #333; color: #fff;
            text-align: center; border-radius: 8px; padding: 16px; position: fixed;
            z-index: 1000; left: 50%; bottom: 30px; transform: translateX(-50%); opacity: 0; transition: opacity 0.5s, bottom 0.5s;
        }
        #toast.show { visibility: visible; opacity: 1; bottom: 50px; }
    </style>
</head>
<body class="flex flex-col h-screen bg-gray-100">

    <nav class="bg-[#3C2A21] text-white p-4 flex justify-between items-center shadow-md z-30 h-16 shrink-0">
        <div class="font-bold text-lg tracking-wider">
            <a href="/" class="flex items-center gap-2">
                <i class="fas fa-mug-hot text-amber-500"></i> TJ CAFÉ GUIDE
            </a>
        </div>
        <div><a href="/" class="text-sm hover:text-amber-500 transition">Volver</a></div>
    </nav>

    <div class="flex flex-col md:flex-row flex-1 overflow-hidden">
        
        <aside class="w-full md:w-1/3 bg-white shadow-xl z-20 flex flex-col order-2 md:order-1 h-1/3 md:h-full border-t md:border-t-0 md:border-r border-gray-200">
            <div class="p-4 bg-gray-50 border-b border-gray-200">
                <h2 class="font-bold text-gray-700 flex items-center gap-2">
                    <i class="fas fa-list text-amber-600"></i> Cafeterías Guardadas
                </h2>
            </div>
            <div id="lista-lugares" class="flex-1 overflow-y-auto p-4 space-y-3">
                <div class="text-center text-gray-400 text-sm mt-10 italic" id="empty-state">
                    No hay cafeterías guardadas aún.<br>Haz clic en el mapa para agregar una.
                </div>
            </div>
        </aside>

        <main class="w-full md:w-2/3 h-2/3 md:h-full relative order-1 md:order-2">
            <div id="map" class="w-full h-full"></div>
        </main>

    </div>

    <div id="toast">Notificación</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // Inicialización
        const map = L.map('map', { zoomControl: false }).setView([32.5149, -117.0382], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);
        
        // Controles accesibles
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Botón de ubicación con ARIA LABEL
        const LocationControl = L.Control.extend({
            options: { position: 'bottomright' },
            onAdd: function(map) {
                const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control custom-control-btn');
                container.innerHTML = '<div class="bg-white w-8 h-8 flex items-center justify-center cursor-pointer hover:bg-gray-100 border-2 border-gray-300 rounded"><i class="fas fa-crosshairs text-gray-700"></i></div>';
                
                // Accesibilidad:
                container.setAttribute('aria-label', 'Centrar mapa en mi ubicación actual');
                container.setAttribute('role', 'button');
                
                container.onclick = function(){ alert("Funcionalidad de GPS simulada"); }
                return container;
            }
        });
        map.addControl(new LocationControl());

        let tempMarker = null;

        // --- LÓGICA DE LISTA Y MAPA ---

        // Función para agregar a la lista lateral (Sincronización)
        function agregarItemLista(data) {
            // Quitar mensaje de vacío si existe
            const emptyState = document.getElementById('empty-state');
            if (emptyState) emptyState.style.display = 'none';

            const lista = document.getElementById('lista-lugares');
            
            // Crear tarjeta HTML
            const item = document.createElement('div');
            item.className = 'cafe-card bg-white p-3 rounded shadow-sm border border-gray-100';
            // Accesibilidad para la tarjeta
            item.setAttribute('role', 'button');
            item.setAttribute('aria-label', `Ir a la ubicación de ${data.nombre}`);
            item.setAttribute('tabindex', '0'); // Hacerla enfocable con teclado

            item.innerHTML = `
                <h3 class="font-bold text-gray-800">${data.nombre}</h3>
                <p class="text-xs text-gray-500 mt-1">
                    <i class="fas fa-map-marker-alt text-amber-500"></i> 
                    Lat: ${data.lat.toFixed(4)}, Lng: ${data.lng.toFixed(4)}
                </p>
            `;

            // Evento: Al hacer clic en la lista, el mapa vuela al punto (FlyTo)
            item.addEventListener('click', () => {
                map.flyTo([data.lat, data.lng], 16, {
                    animate: true,
                    duration: 1.5
                });
                // Opcional: abrir popup automáticamente
                // marker.openPopup(); (Requeriría guardar referencia a los markers)
            });

            lista.prepend(item); // Agregar al principio
        }

        // --- LÓGICA DE GUARDADO (Igual que fase 3 + llamada a lista) ---

        map.on('click', function(e) {
            if (tempMarker) map.removeLayer(tempMarker);
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;
            
            tempMarker = L.marker([lat, lng]).addTo(map);

            const popupContent = `
                <div class="text-center p-2">
                    <p class="font-bold mb-2 text-gray-700">¿Nuevo Café?</p>
                    <div id="popup-controls">
                        <button onclick="cancelarPunto()" class="bg-gray-300 px-3 py-1 rounded text-sm mr-2">Cancelar</button>
                        <button onclick="guardarPunto(${lat}, ${lng})" class="bg-amber-500 text-white px-3 py-1 rounded text-sm">Guardar</button>
                    </div>
                    <div id="popup-loading" class="hidden text-amber-600 font-bold text-sm mt-2">
                        <div class="spinner"></div> Guardando...
                    </div>
                </div>
            `;
            tempMarker.bindPopup(popupContent).openPopup();
            
            tempMarker.on('popupclose', function() {
                setTimeout(() => {
                    if (tempMarker && !tempMarker.isSaved) {
                        map.removeLayer(tempMarker);
                        tempMarker = null;
                    }
                }, 100);
            });
        });

        window.cancelarPunto = function() {
            if (tempMarker) {
                map.removeLayer(tempMarker);
                tempMarker = null;
            }
        };

        window.guardarPunto = function(lat, lng) {
            document.getElementById('popup-controls').classList.add('hidden');
            document.getElementById('popup-loading').classList.remove('hidden');

            fetch('/guardar_punto', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ lat: lat, lng: lng }),
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    tempMarker.isSaved = true; 
                    tempMarker.closePopup();
                    tempMarker.bindPopup(`<b class="text-amber-700">${data.data.nombre}</b>`).openPopup();
                    
                    showToast("¡Agregado a la lista!");
                    
                    // AQUI ESTÁ LA MAGIA DE LA FASE 4:
                    agregarItemLista(data.data);
                    
                    tempMarker = null; 
                }
            })
            .catch((error) => {
                console.error(error);
                showToast("Error");
            });
        };

        function showToast(message) {
            var x = document.getElementById("toast");
            x.innerText = message; x.className = "show";
            setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
        }
    </script>
</body>
</html>
